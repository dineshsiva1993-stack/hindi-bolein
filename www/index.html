<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>இந்தி பேசுவோம்</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600&family=Tiro+Devanagari+Hindi&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&display=swap">
<style>
/* Layout: one phone-width column, sticky header with speed and voice controls, content area, fixed 4-tab bar.
   The shirorekha (headline stroke) of Devanagari is echoed once, as a kumkum rule under the wordmark. */
:root {
  --bg: #EEF2EF;
  --surface: #FFFFFF;
  --surface2: #E3EAE6;
  --ink: #14231F;
  --mute: #566761;
  --line: #CCD7D1;
  --accent: #0B6B5D;
  --accent-ink: #FFFFFF;
  --soft: #D3EAE2;
  --kumkum: #B8322B;
  --good: #1B7A44;
  --bad: #B8322B;
  --f-ui: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-hi: 'Tiro Devanagari Hindi', 'Noto Sans Devanagari', 'Mangal', serif;
  --f-ta: 'Figtree', 'Noto Sans Tamil', 'Latha', 'Nirmala UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1715; --surface: #16231F; --surface2: #1E2F2A; --ink: #E7EFEB; --mute: #9DB0A8; --line: #2A3D37;
    --accent: #4CC7AC; --accent-ink: #06201A; --soft: #1B3A33; --kumkum: #FF7A6B; --good: #5BD08A; --bad: #FF7A6B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1715; --surface: #16231F; --surface2: #1E2F2A; --ink: #E7EFEB; --mute: #9DB0A8; --line: #2A3D37;
  --accent: #4CC7AC; --accent-ink: #06201A; --soft: #1B3A33; --kumkum: #FF7A6B; --good: #5BD08A; --bad: #FF7A6B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-ui);
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent; }
button:focus-visible, [role="button"]:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ta { font-family: var(--f-ta); }
.hi { font-family: var(--f-hi); }
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; }
.brand { font-family: var(--f-hi); font-size: 26px; line-height: 1.1; position: relative; padding-bottom: 7px; white-space: nowrap; }
.brand::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px; background: var(--kumkum); }
.ctl { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 40px; padding: 0 11px; font-size: 13px; font-weight: 600; color: var(--mute); font-family: var(--f-ta), var(--f-ui); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tog { min-height: 40px; min-width: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 700; font-size: 15px; color: var(--mute); font-family: var(--f-ta); }
.tog[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tog[disabled] { opacity: .45; cursor: not-allowed; }

.tog.txt { padding: 0 10px; min-width: 52px; font-size: 13px; font-weight: 600; }
.seg.lang button { min-width: 40px; padding: 0 9px; font-family: var(--f-ui); }
main { padding-block: 16px 110px; min-height: 70vh; }
.notice { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--kumkum); font-size: 13.5px; font-family: var(--f-ta), var(--f-ui); }

/* hero */
.hero { padding: 6px 0 14px; }
.hero h1 { margin: 0; font-family: var(--f-hi); font-weight: 400; font-size: clamp(34px, 9vw, 52px); line-height: 1.15; text-wrap: balance; }
.hero p { margin: 6px 0 0; color: var(--mute); font-family: var(--f-ta); font-size: 15px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: 13px; color: var(--mute); }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.search { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 0 14px; font: inherit; font-family: var(--f-ta), var(--f-ui); margin-top: 6px; }
.search::placeholder { color: var(--mute); }

.daily { margin-top: 16px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--soft); }
.daily .lbl { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); font-family: var(--f-ta), var(--f-ui); }
.daily .hi { font-size: 21px; line-height: 1.35; }
.daily .ta { font-size: 13.5px; color: var(--mute); }

.gh { display: flex; align-items: baseline; gap: 8px; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.gh h2 { margin: 0; font-size: 17px; font-family: var(--f-ta); font-weight: 600; }
.gh span { color: var(--mute); font-size: 12.5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-height: 112px; }
.card:active { transform: scale(.985); }
.card .g { font-family: var(--f-hi); font-size: 30px; line-height: 1.2; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .t { font-family: var(--f-ta); font-size: 14px; font-weight: 600; line-height: 1.35; margin-top: auto; }
.card .e { font-size: 12px; color: var(--mute); line-height: 1.3; }
.card .n { font-size: 11.5px; color: var(--mute); font-variant-numeric: tabular-nums; }

/* section view */
.bar { display: flex; align-items: center; gap: 10px; }
.back { min-height: 44px; min-width: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.sh { margin: 12px 0 4px; }
.sh h2 { margin: 0; font-family: var(--f-ta); font-size: 22px; line-height: 1.3; font-weight: 600; text-wrap: balance; }
.sh .e { color: var(--mute); font-size: 13px; }
.note { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--surface2); font-family: var(--f-ta); font-size: 13.5px; color: var(--mute); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 10px; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-family: var(--f-ta), var(--f-ui); background: var(--surface); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 8px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--accent); }
.btn.pri[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 40px; gap: 12px; align-items: center; padding: 10px 6px 10px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.row.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--soft); background: var(--soft); }
.play { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; position: relative; flex: none; }
.row.on .play::after, .daily.on .play::after, .bub.on .bplay::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent); animation: pulse 1.1s ease-out infinite; }
@keyframes pulse { from { transform: scale(.85); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }
.txt { min-width: 0; cursor: pointer; }
.txt .hi { font-size: 24px; line-height: 1.35; overflow-wrap: anywhere; }
.txt .hi.big { font-size: 40px; line-height: 1.2; color: var(--accent); }
.txt .pr { font-family: var(--f-ta); color: var(--accent); font-size: 15px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
.txt .ro { font-size: 12.5px; color: var(--mute); font-style: italic; overflow-wrap: anywhere; }
.txt .mn { margin-top: 3px; font-family: var(--f-ta); font-size: 14.5px; line-height: 1.45; overflow-wrap: anywhere; }
.txt .mn small { color: var(--mute); font-family: var(--f-ui); font-size: 12.5px; display: block; }
.star { width: 40px; height: 44px; display: grid; place-items: center; color: var(--mute); }
.star[aria-pressed="true"] { color: var(--kumkum); }
.empty { padding: 28px 12px; text-align: center; color: var(--mute); font-family: var(--f-ta); }

/* dialogues */
.dcard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.dcard .t { font-family: var(--f-ta); font-weight: 600; font-size: 16px; }
.dcard .e { color: var(--mute); font-size: 13px; }
.dcard .c { margin-left: auto; color: var(--mute); font-size: 12.5px; white-space: nowrap; }
.dcard .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--soft); color: var(--accent); flex: none; font-family: var(--f-hi); font-size: 22px; }
.chat { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.bub { display: flex; gap: 10px; align-items: flex-start; max-width: 92%; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); min-width: 0; cursor: pointer; }
.bub.r1 { align-self: flex-end; background: var(--soft); border-color: transparent; }
.bub.on { outline: 2px solid var(--accent); }
.bplay { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; position: relative; }
.bub .who { font-family: var(--f-ta); font-size: 12px; color: var(--mute); font-weight: 600; margin-bottom: 2px; }
.bub .body { min-width: 0; }
.bub .hi { font-size: 21px; line-height: 1.4; overflow-wrap: anywhere; }
.bub .pr { font-family: var(--f-ta); color: var(--accent); font-size: 14.5px; line-height: 1.4; overflow-wrap: anywhere; }
.bub .ro { font-size: 12px; color: var(--mute); font-style: italic; overflow-wrap: anywhere; }
.bub .mn { margin-top: 3px; font-family: var(--f-ta); font-size: 14px; overflow-wrap: anywhere; }
.bub .mn small { display: block; color: var(--mute); font-family: var(--f-ui); font-size: 12px; }

/* practice */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.panel h3 { margin: 0 0 4px; font-family: var(--f-ta); font-size: 17px; }
.sel { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 12px; font: inherit; font-family: var(--f-ta), var(--f-ui); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.fc { text-align: center; padding: 22px 16px; min-height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.fc .hi { font-size: clamp(30px, 8vw, 40px); line-height: 1.3; overflow-wrap: anywhere; }
.fc .pr { font-family: var(--f-ta); color: var(--accent); font-size: 18px; }
.fc .ro { color: var(--mute); font-style: italic; font-size: 14px; }
.fc .mn { font-family: var(--f-ta); font-size: 20px; line-height: 1.4; }
.fc .mn small { display: block; font-family: var(--f-ui); color: var(--mute); font-size: 14px; }
.bigplay { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; position: relative; }
.bigplay.on::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--accent); animation: pulse 1.1s ease-out infinite; }
.prog { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s; }
.meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
.opt { width: 100%; text-align: left; padding: 12px 14px; min-height: 52px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; font-family: var(--f-ta); font-size: 16px; line-height: 1.4; }
.opt small { display: block; font-family: var(--f-ui); color: var(--mute); font-size: 12.5px; }
.opt.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, var(--surface)); }
.opt.no { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.opt[disabled] { cursor: default; }
.score { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.miss { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.miss div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface2); }
.miss .hi { font-size: 18px; }
.miss .ta { font-size: 14px; text-align: right; }

/* plan */
.week { padding: 14px; margin-bottom: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.week.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--soft); }
.week h3 { margin: 0; font-family: var(--f-ta); font-size: 16px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.week h3 span { font-family: var(--f-ui); font-size: 12.5px; color: var(--mute); font-weight: 400; }
.week p { margin: 6px 0 0; font-family: var(--f-ta); font-size: 14px; }
.week .goal { color: var(--accent); font-weight: 600; }
.days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0 14px; }
.day { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--mute); }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tip { padding: 12px 0; border-bottom: 1px solid var(--line); font-family: var(--f-ta); }
.tip b { display: block; font-size: 15px; }
.tip span { font-size: 14px; color: var(--mute); }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--mute); font-size: 11.5px; font-weight: 600; font-family: var(--f-ta), var(--f-ui); }
.tab[aria-current="page"] { color: var(--accent); }
.tab svg { width: 22px; height: 22px; }
@media (prefers-reduced-motion: reduce) { .row.on .play::after, .bub.on .bplay::after, .bigplay.on::after { animation: none; } .prog i { transition: none; } }

/* ai talk */
.aib{align-self:flex-start;max-width:92%;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;min-width:0}
.aib.me{align-self:flex-end;background:var(--soft);border-color:transparent;display:block}
.aib .who{font-family:var(--f-ta);font-size:12px;color:var(--mute);font-weight:600;margin-bottom:2px}
.aib .hi{font-size:21px;line-height:1.4;overflow-wrap:anywhere}
.aib .pr{font-family:var(--f-ta);color:var(--accent);font-size:14.5px;line-height:1.4}
.aib .ro{font-size:12px;color:var(--mute);font-style:italic}
.aib .mn{margin-top:3px;font-family:var(--f-ta);font-size:14px}
.aifb{align-self:flex-end;max-width:92%;padding:12px;border-radius:14px;border:1.5px solid var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface));font-family:var(--f-ta);font-size:14.5px}
.aifb.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.aifb .lbl{font-size:12px;font-weight:700;color:var(--mute)}
.aifb .hi{font-family:var(--f-hi);font-size:22px;line-height:1.4}
.aifb .pr{color:var(--accent);font-weight:500}
.aifb .ro{font-family:var(--f-ui);font-size:12px;color:var(--mute);font-style:italic}
.aifb .why,.aifb .tip{margin-top:6px;line-height:1.5}
.aifb .tip{color:var(--mute)}
.aiact{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.aiact .btn{min-height:40px;padding:0 12px;font-size:13.5px}
.aisw{margin-top:8px}
.aisw .w{display:inline-block;margin:2px 3px 2px 0;padding:2px 8px;border-radius:8px;font-family:var(--f-hi);font-size:20px;border:1.5px solid var(--line)}
.aisw .w2{border-color:var(--good);color:var(--good)}.aisw .w1{border-color:#B7791F;color:#B7791F}.aisw .w0{border-color:var(--bad);color:var(--bad)}
.aistat{min-height:22px;margin:6px 2px 0;font-size:13.5px;color:var(--mute);font-family:var(--f-ta)}
.aistat.bad{color:var(--bad)}
.aibar{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0;display:flex;gap:8px;align-items:center}
.aibar input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:24px;padding:0 16px;background:var(--surface);color:var(--ink);font:inherit;font-family:var(--f-hi),var(--f-ta),var(--f-ui)}
.mic{width:64px;height:64px;border-radius:50%;background:var(--kumkum);color:var(--accent-ink);display:grid;place-items:center;flex:none;position:relative}
.mic.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--kumkum);animation:pulse 1.1s ease-out infinite}
.snd{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
@media (prefers-reduced-motion: reduce){.mic.on::after{animation:none}}
/* ===== v3 polish ===== */
body { background: radial-gradient(900px 420px at 100% -8%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 62%), radial-gradient(700px 360px at -10% 8%, color-mix(in srgb, var(--kumkum) 9%, transparent), transparent 60%), var(--bg); background-attachment: fixed; }
.top { background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: saturate(1.5) blur(12px); backdrop-filter: saturate(1.5) blur(12px); }
.tabs { background: color-mix(in srgb, var(--surface) 90%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 -8px 28px rgba(8,40,30,.10); border-top-color: transparent; }
.tab { position: relative; transition: color .2s; }
.tab svg { transition: transform .2s; }
.tab[aria-current="page"] svg { transform: translateY(-2px) scale(1.12); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 4px 4px; background: var(--accent); }
.card, .row, .dcard, .panel, .week, .bub, .aib { box-shadow: 0 1px 2px rgba(8,40,30,.05), 0 8px 22px rgba(8,40,30,.06); transition: transform .15s, box-shadow .2s, border-color .2s, background .2s; }
.dcard:active, .row:active, .card:active { transform: scale(.985); }
.btn { transition: transform .12s, background .2s, border-color .2s; }
.btn:active { transform: scale(.97); }
.btn.pri { background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 72%, #000)); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 38%, transparent); border-color: transparent; }
.prog i { background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #fff)); }
.hero h1 { background: linear-gradient(100deg, var(--ink) 35%, var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; padding-bottom: 4px; }
.play, .bplay, .bigplay, .snd { box-shadow: 0 6px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
.mic { box-shadow: 0 8px 18px color-mix(in srgb, var(--kumkum) 40%, transparent); transition: transform .15s; }
.mic:active { transform: scale(.94); }
.mic.on { animation: micbeat 1s ease-in-out infinite; }
@keyframes micbeat { 50% { transform: scale(1.08); } }
.daily { background: linear-gradient(135deg, var(--soft), color-mix(in srgb, var(--soft) 55%, var(--surface))); box-shadow: 0 8px 22px rgba(8,40,30,.08); }
.gh h2 { letter-spacing: .01em; }
main > * { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* progress card */
.pgcard { margin-top: 14px; padding: 14px; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(160deg, var(--surface), color-mix(in srgb, var(--soft) 45%, var(--surface))); box-shadow: 0 10px 26px rgba(8,40,30,.08); }
.pgrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.pgstat { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.pgstat .pgi { font-size: 20px; }
.pgstat b { font-size: 22px; font-variant-numeric: tabular-nums; }
.pgstat small { color: var(--mute); font-size: 11.5px; font-family: var(--f-ta), var(--f-ui); }
.pgbar { margin-top: 10px; }
.pgdots { display: flex; justify-content: space-between; margin-top: 12px; }
.pgd { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.pgd i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 700; background: var(--surface2); color: var(--mute); }
.pgd.on i { background: var(--accent); color: var(--accent-ink); }
.pgd.now i { outline: 2px solid var(--accent); outline-offset: 2px; }
.pgd small { font-size: 10.5px; color: var(--mute); font-family: var(--f-ta), var(--f-ui); }

/* review */
.rvcard { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; background: linear-gradient(135deg, var(--soft), var(--surface)); }
.rvsub { color: var(--mute); font-size: 13.5px; margin-top: 2px; }

/* roleplay */
.rpt { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft), 0 10px 26px rgba(8,40,30,.10); margin-top: 14px; }
.rpt .lbl { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); font-family: var(--f-ta), var(--f-ui); }
.rpline { display: flex; gap: 14px; align-items: center; }
.rptxt { min-width: 0; }
.rptxt .hi { font-size: 26px; line-height: 1.35; overflow-wrap: anywhere; }
.rptxt .hi.rpq { color: var(--mute); }
.rptxt .pr { font-family: var(--f-ta); color: var(--accent); font-size: 15px; }
.rptxt .ro { font-size: 12.5px; color: var(--mute); font-style: italic; }
.rptxt .mn { margin-top: 4px; font-family: var(--f-ta); font-size: 14.5px; }
.rptxt .mn small { display: block; color: var(--mute); font-family: var(--f-ui); font-size: 12.5px; }
.rpact { display: flex; align-items: center; gap: 14px; }
.rpside { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.aifbx { min-height: 0; font-family: var(--f-ta); }
.aifbx .aisw .w, .aifbx .w { display: inline-block; margin: 2px 3px 2px 0; padding: 2px 8px; border-radius: 8px; font-family: var(--f-hi); font-size: 20px; border: 1.5px solid var(--line); background: var(--surface); }
.aifbx .w2 { border-color: var(--good); color: var(--good); } .aifbx .w1 { border-color: #B7791F; color: #B7791F; } .aifbx .w0 { border-color: var(--bad); color: var(--bad); }
.rpstar { color: #E0A100; letter-spacing: 1px; font-size: 15px; }
.rpbig { font-size: 40px; color: #E0A100; letter-spacing: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; font-family: var(--f-ta), var(--f-ui); box-shadow: 0 10px 28px rgba(0,0,0,.28); animation: toast 2s ease both; pointer-events: none; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 14px); } 12%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -8px); } }
@media (prefers-reduced-motion: reduce) { main > *, .toast, .mic.on { animation: none; } }
.bigplay, .mic, .snd, .play, .bplay { flex: none; }
.rpt .aifbx:empty, .rpt .aistat:empty { display: none; }
.rpt.stack { gap: 10px; }

      Array.prototype.forEach.call(document.querySelectorAll('.toast'), function (x) { if (x.parentNode) x.parentNode.removeChild(x); }); var e = document.createElement('div'); e.className = 'toast'; e.setAttribute('role', 'status'); e.textContent = m;
      document.body.appendChild(e); setTimeout(function () { if (e.parentNode) e.parentNode.removeChild(e); }, 2000);
    } catch (x) { }
  }

  /* ---- progress store ---- */
  var PG = sget('hindi.pg', null) || {};
  PG.xp = PG.xp || 0; PG.streak = PG.streak || 0; PG.best = PG.best || 0; PG.last = PG.last || '';
  PG.box = PG.box || {}; PG.log = PG.log || {}; PG.rp = PG.rp || {};
  var DAILY_GOAL = 30;
  function dkey(d) { d = d || new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function dnum() { var d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
  function pgSave() { sset('hindi.pg', PG); }
  function yday() { var y = new Date(); y.setDate(y.getDate() - 1); return dkey(y); }
  function liveStreak() { return (PG.last === dkey() || PG.last === yday()) ? PG.streak : 0; }
  function pgTouch() {
    var td = dkey(); if (PG.last === td) return;
    PG.streak = PG.last === yday() ? PG.streak + 1 : 1;
    PG.best = Math.max(PG.best, PG.streak); PG.last = td;
  }
  function lvlOf(xp) { var l = 1, need = 60; while (xp >= need) { xp -= need; l++; need = 60 + (l - 1) * 30; } return { l: l, cur: xp, need: need }; }
  function addXP(n) {
    if (!n) return;
    var before = lvlOf(PG.xp).l, td = dkey(), hadToday = (PG.log[td] || 0) >= DAILY_GOAL;
    pgTouch(); PG.xp += n; PG.log[td] = (PG.log[td] || 0) + n; pgSave();
    var after = lvlOf(PG.xp).l;
    if (after > before) setTimeout(function () { hbToast('🏅 ' + LL('நிலை ', 'Level ') + after + '!'); }, 700);
    else if (!hadToday && PG.log[td] >= DAILY_GOAL) setTimeout(function () { hbToast('🎯 ' + LL('இன்றைய இலக்கு முடிந்தது!', 'Daily goal reached!')); }, 700);
  }
  function progCard() {
    var lv = lvlOf(PG.xp), td = PG.log[dkey()] || 0, pct = Math.round(lv.cur / lv.need * 100), gp = Math.min(100, Math.round(td / DAILY_GOAL * 100));
    var dots = '', names = LANG === 'en' ? ['S', 'M', 'T', 'W', 'T', 'F', 'S'] : ['ஞா', 'தி', 'செ', 'பு', 'வி', 'வெ', 'ச'];
    for (var k = 6; k >= 0; k--) {
      var d = new Date(); d.setDate(d.getDate() - k);
      var on = (PG.log[dkey(d)] || 0) > 0;
      dots += '<span class="pgd' + (on ? ' on' : '') + (k === 0 ? ' now' : '') + '"><i>' + (on ? '✓' : '') + '</i><small>' + names[d.getDay()] + '</small></span>';
    }
    var mastered = 0; Object.keys(PG.box).forEach(function (id) { if (PG.box[id].b >= 5) mastered++; });
    return '<div class="pgcard"><div class="pgrow">' +
      '<div class="pgstat"><span class="pgi">🔥</span><b>' + liveStreak() + '</b><small>' + esc(LL('நாள் தொடர்', 'day streak')) + '</small></div>' +
      '<div class="pgstat"><span class="pgi">⭐</span><b>' + PG.xp + '</b><small>XP</small></div>' +
      '<div class="pgstat"><span class="pgi">🏅</span><b>' + lv.l + '</b><small>' + esc(LL('நிலை', 'level')) + '</small></div>' +
      '<div class="pgstat"><span class="pgi">🌱</span><b>' + mastered + '</b><small>' + esc(LL('தேர்ச்சி', 'mastered')) + '</small></div></div>' +
      '<div class="pgbar"><div class="meta"><span>' + esc(LL('இன்றைய இலக்கு', 'Daily goal')) + '</span><span>' + Math.min(td, DAILY_GOAL) + ' / ' + DAILY_GOAL + ' XP</span></div><div class="prog"><i style="width:' + gp + '%"></i></div></div>' +
      '<div class="pgbar"><div class="meta"><span>' + esc(LL('அடுத்த நிலைக்கு', 'To next level')) + '</span><span>' + lv.cur + ' / ' + lv.need + '</span></div><div class="prog"><i style="width:' + pct + '%"></i></div></div>' +
      '<div class="pgdots">' + dots + '</div></div>';
  }

  /* ---- spaced review (Leitner boxes) ---- */
  var INT = [0, 1, 2, 4, 8, 16];
  function srsGrade(id, ok) {
    var b = PG.box[id] || { b: 0, d: 0 };
    b.b = ok ? Math.min(5, Math.max(1, b.b + 1)) : 1;
    b.d = ok ? dnum() + INT[b.b] : dnum();
    PG.box[id] = b; addXP(ok ? 3 : 1);
  }
  function dueIds() {
    var n = dnum();
    return Object.keys(PG.box).filter(function (id) { return ITEM[id] && ITEM[id].sec && !ITEM[id].sec.noquiz && PG.box[id].d <= n; })
      .sort(function (a, b) { return PG.box[a].b - PG.box[b].b; });
  }
  function reviewDeck() {
    var due = dueIds().slice(0, 12).map(function (id) { return ITEM[id]; });
    if (due.length < 8) {
      var fresh = shuffle(poolFor('all').filter(function (x) { return !PG.box[x.id]; })).slice(0, 10 - due.length);
      due = due.concat(fresh);
    }
    return shuffle(due);
  }
  function reviewCard() {
    var due = dueIds().length, seen = Object.keys(PG.box).length;
    return '<div class="panel rvcard"><div><h3>' + esc(LL('இன்றைய மீள்பார்வை', 'Daily review')) + '</h3><div class="ta rvsub">' +
      esc(due ? LL(due + ' சொற்கள் மீள்பார்வைக்குக் காத்திருக்கின்றன', due + ' words are due today') : (seen ? LL('இன்று எல்லாம் முடிந்தது! புதியவற்றைப் பாருங்கள்.', 'All caught up! Try some new words.') : LL('புதிய சொற்களுடன் தொடங்குங்கள்', 'Start with new words'))) +
      '</div></div><button type="button" class="btn pri" data-act="rvstart">' + esc(LL('தொடங்கு', 'Start')) + '</button></div>';
  }

  /* ---- offline roleplay (no AI, no key) ---- */
  var RP = { on: false, pick: false, d: null, role: 1, i: 0, log: [], scores: [], hide: false, rev: false, tries: 0, fb: '', done: false, sum: null };
  function rpStars(n) { return n >= 3 ? '★★★' : n === 2 ? '★★☆' : n === 1 ? '★☆☆' : ''; }
  function rpHome() {
    var h = '<div class="gh"><h2>' + esc(LL('நடித்துப் பேசுங்கள்', 'Roleplay')) + '</h2><span>' + esc(LL('AI, கட்டணம் தேவையில்லை', 'no AI, no cost')) + '</span></div><div class="list">';
    DLGS.forEach(function (d, i) {
      var best = PG.rp[d.id];
      h += '<button type="button" class="dcard" data-act="rpopen" data-d="' + d.id + '"><span class="ic">' + (i + 1) + '</span><span><div class="t">' + esc(dTitle(d)) + '</div>' + (isEn() ? '' : '<div class="e">' + esc(d.en) + '</div>') + '</span><span class="c">' + (best ? '<span class="rpstar">' + rpStars(best.stars) + '</span>' : d.lines.length + ' ' + esc(LL('வரிகள்', 'lines'))) + '</span></button>';
    });
    return h + '</div><p class="ta" style="color:var(--mute);font-size:13px">' + esc(LL('உங்கள் பாத்திரத்தின் வரியை உரக்கச் சொல்லுங்கள்; மதிப்பெண் உடனே கிடைக்கும். மற்ற பாத்திரத்தை நான் பேசுகிறேன்.', 'Say your character\'s lines out loud and get an instant score. I speak the other character.')) + '</p>';
  }
  function rpHeader(title) {
    return '<div class="bar"><button type="button" class="back" data-act="rpback" aria-label="' + esc(t('back')) + '">' + I.back + '</button><div class="sh" style="margin:0"><h2>' + esc(title) + '</h2></div></div>';
  }
  function rpEnd() {
    var s = RP.sum || { avg: 0, stars: 1, xp: 0 };
    return '<div class="panel stack rpend" style="text-align:center"><div class="rpbig">' + rpStars(s.stars) + '</div><h3>' + esc(LL('அருமை! முடித்துவிட்டீர்கள் 🎉', 'Well done! You finished 🎉')) + '</h3>' +
      '<div class="score">' + s.avg + '%</div><div class="ta" style="color:var(--mute)">' + esc(LL('சராசரி உச்சரிப்பு மதிப்பெண்', 'Average pronunciation score')) + ' · +' + s.xp + ' XP</div>' +
      '<button type="button" class="btn pri" data-act="rpagain" style="justify-content:center">' + esc(LL('மீண்டும் பேசு', 'Play again')) + '</button>' +
      '<button type="button" class="btn" data-act="rpswap" style="justify-content:center">' + esc(LL('பாத்திரம் மாற்று', 'Swap roles')) + '</button>' +
      '<button type="button" class="btn" data-act="rpback" style="justify-content:center">' + esc(LL('பட்டியலுக்குத் திரும்பு', 'Back to list')) + '</button></div>';
  }
  function viewRp() {
    var d = RP.d, h;
    if (RP.pick) {
      h = rpHeader(dTitle(d));
      h += '<p class="ta" style="color:var(--mute)">' + esc(LL('நீங்கள் எந்தப் பாத்திரம்? மற்றதை நான் பேசுகிறேன்.', 'Which role will you play? I will speak the other one.')) + '</p><div class="list">';
      [0, 1].forEach(function (r) {
        h += '<button type="button" class="dcard" data-act="rprole" data-r="' + r + '"><span class="ic">' + (r ? 'B' : 'A') + '</span><span><div class="t">' + esc(roleName(d, r)) + '</div><div class="e">' + esc(LL('நான் இதைப் பேசுவேன்', 'I will play this role')) + '</div></span></button>';
      });
      h += '</div><div class="actions"><button type="button" class="btn" data-act="rphide" aria-pressed="' + RP.hide + '">🙈 ' + esc(LL('சவால்: இந்தியை மறை', 'Challenge: hide Hindi')) + '</button></div>' +
        '<p class="ta" style="color:var(--mute);font-size:13px">' + esc(LL('சவால் முறையில் தமிழ்/ஆங்கிலப் பொருளை மட்டும் பார்த்து இந்தியில் சொல்ல வேண்டும்; கூடுதல் XP கிடைக்கும்.', 'In challenge mode you see only the meaning and must say it in Hindi from memory, for bonus XP.')) + '</p>';
      return h;
    }
    var n = d.lines.length;
    h = rpHeader(dTitle(d) + ' · ' + roleName(d, RP.role));
    h += '<div class="prog" style="margin:10px 0"><i style="width:' + Math.round(RP.i / n * 100) + '%"></i></div><div class="chat" id="rpchat">';
    RP.log.forEach(function (e) {
      var l = e.l;
      h += '<div class="bub' + (e.me ? ' r1' : '') + '" data-id="' + l.id + '" data-act="rpsay" role="button" tabindex="0"><span class="bplay">' + I.playS + '</span><div class="body"><div class="who">' + esc(roleName(d, l.r)) + (e.me && e.pct != null ? ' · ' + e.pct + '%' : '') + '</div><div class="hi">' + esc(l.hi) + '</div>' + soundLines(l) + '<div class="mn">' + meanBlock(l) + '</div></div></div>';
    });
    h += '</div>';
    if (RP.done) return h + rpEnd() + '<div id="rpend"></div>';
    var l = d.lines[RP.i], showHi = !RP.hide || RP.rev;
    h += '<div class="panel rpt stack"><div class="lbl">' + esc(LL('உங்கள் வரி', 'Your line')) + '</div>' +
      '<div class="rpline"><button type="button" class="bigplay" data-act="rpsay" data-id="' + l.id + '" aria-label="' + esc(t('listen')) + '">' + I.playL + '</button><div class="rptxt">';
    if (showHi) h += '<div class="hi">' + esc(l.hi) + '</div>' + soundLines(l);
    else h += '<div class="hi rpq">？</div>';
    h += '<div class="mn">' + meanBlock(l) + '</div></div></div>';
    if (!showHi) h += '<button type="button" class="btn" data-act="rpreveal">👁 ' + esc(LL('இந்தியைக் காட்டு', 'Show Hindi')) + '</button>';
    h += '<div class="aifbx" id="rpres">' + RP.fb + '</div><div class="aistat" id="rpstat" role="status" aria-live="polite"></div>';
    h += '<div class="rpact"><button type="button" class="mic" id="rpmic" data-act="rpmic" aria-label="' + esc(t('aiMic')) + '"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>' +
      '<div class="rpside"><div class="ta" style="color:var(--mute);font-size:13px">' + esc(LL('மைக்கைத் தொட்டு இந்த வரியைச் சொல்லுங்கள்', 'Tap the mic and say this line')) + '</div>' +
      '<div><button type="button" class="btn" data-act="' + (SR ? 'rpskip' : 'rpself') + '">' + esc(SR ? LL('தவிர் ›', 'Skip ›') : LL('நான் சொல்லிவிட்டேன் ✓', 'I said it ✓')) + '</button></div></div></div>';
    if (!SR) h += '<div class="notice">' + esc(t('aiNoSR')) + '</div>';
    return h + '</div><div id="rpend"></div>';
  }
  function rpStat(m, bad) { var s = $('#rpstat'); if (s) { s.textContent = m || ''; s.className = 'aistat' + (bad ? ' bad' : ''); } }
  function rpScroll() { setTimeout(function () { var e = $('#rpend'); if (e && e.scrollIntoView) e.scrollIntoView({ block: 'end', behavior: REDUCED ? 'auto' : 'smooth' }); }, 60); }
  async function rpSpeak(ids) {
    stopAll(); var r = run;
    for (var k = 0; k < ids.length; k++) {
      setOn(ids[k]); await speakItem(ITEM[ids[k]], r);
      if (r !== run) return;
      await after(250);
    }
    setOn(null);
  }
  function rpFinish() {
    var sc = RP.scores.filter(function (x) { return x != null; });
    var avg = sc.length ? Math.round(sc.reduce(function (a, b) { return a + b; }, 0) / sc.length) : 0;
    var stars = avg >= 85 ? 3 : avg >= 70 ? 2 : 1, xp = 15 + (avg >= 85 ? 10 : 0);
    var prev = PG.rp[RP.d.id]; if (!prev || avg > prev.avg) PG.rp[RP.d.id] = { avg: avg, stars: stars };
    RP.sum = { avg: avg, stars: stars, xp: xp }; addXP(xp);
  }
  function rpAdvance() {
    var d = RP.d, fresh = [];
    while (RP.i < d.lines.length && d.lines[RP.i].r !== RP.role) { RP.log.push({ l: d.lines[RP.i], me: false }); fresh.push(d.lines[RP.i].id); RP.i++; }
    RP.fb = ''; RP.rev = false; RP.tries = 0;
    if (RP.i >= d.lines.length) { RP.done = true; rpFinish(); }
    render(); rpScroll();
    if (fresh.length) rpSpeak(fresh);
  }
  function rpStart() {
    RP.pick = false; RP.i = 0; RP.log = []; RP.scores = []; RP.done = false; RP.sum = null; RP.fb = '';
    stopAll(); rpAdvance(); toTop();
  }
  function rpScore(alts) {
    var l = RP.d.lines[RP.i]; if (!l) return;
    var b = aiCmp(l.hi, alts); RP.tries++;
    if (b.pct >= 60) {
      var xp = (b.pct >= 85 ? 12 : 8) + ((RP.hide && !RP.rev) ? 4 : 0);
      addXP(xp); hbToast('+' + xp + ' XP');
      RP.log.push({ l: l, me: true, pct: b.pct }); RP.scores.push(b.pct); RP.i++; rpAdvance();
    } else {
      RP.fb = aiSwHtml(b) + (RP.tries >= 3 ? '<div class="aistat">' + esc(LL('இந்த வரியைக் கேட்டு மெதுவாகச் சொல்லிப் பாருங்கள்; அல்லது தவிர்க்கலாம்.', 'Listen again and say it slowly, or skip this line.')) + '</div>' : '');
      render();
    }
  }
  document.addEventListener('click', function (e) {
    var tg = e.target.closest('[data-act^="rp"],[data-act^="rv"]'); if (!tg) return;
    var a = tg.getAttribute('data-act');
    if (a === 'rpopen') { RP.d = DBY[tg.getAttribute('data-d')]; RP.on = true; RP.pick = true; render(); toTop(); }
    else if (a === 'rpback') { stopAll(); RP.on = false; RP.pick = false; RP.d = null; render(); toTop(); }
    else if (a === 'rphide') { RP.hide = !RP.hide; render(); }
    else if (a === 'rprole') { RP.role = +tg.getAttribute('data-r'); rpStart(); }
    else if (a === 'rpagain') { rpStart(); }
    else if (a === 'rpswap') { stopAll(); RP.pick = true; RP.done = false; render(); toTop(); }
    else if (a === 'rpsay') { var h = tg.closest('[data-id]'); if (h) playOne(h.getAttribute('data-id')); }
    else if (a === 'rpreveal') { RP.rev = true; render(); }
    else if (a === 'rpskip') { var l = RP.d.lines[RP.i]; if (!l) return; stopAll(); RP.log.push({ l: l, me: true, pct: null }); RP.scores.push(null); RP.i++; rpAdvance(); }
    else if (a === 'rpself') { var l2 = RP.d.lines[RP.i]; if (!l2) return; stopAll(); addXP(3); RP.log.push({ l: l2, me: true, pct: null }); RP.scores.push(null); RP.i++; rpAdvance(); }
    else if (a === 'rpmic') {
      if (AI.listening && AI.rec) { AI.rec.stop(); return; }
      rpStat(LL('கேட்கிறேன்…', 'Listening…'));
      aiListen(function (alts) { rpScore(alts); }, function (c) { rpStat(c === 'no-speech' ? t('aiNoSpeech') : aiMicErr(c), true); });
    }
    else if (a === 'rvstart') {
      var deck = reviewDeck(); if (!deck.length) return;
      P.src = 'all'; startFlash(deck); toTop();
    }
  });

  /* ---------- boot ---------- */
  if (Aud.ok) {
    loadVoices();
    try { window.speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) { window.speechSynthesis.onvoiceschanged = loadVoices; }
  }
  setTimeout(function () { Aud.ready = true; syncCtl(); renderBanner(); }, 2500);
  window.addEventListener('pagehide', function () { try { window.speechSynthesis.cancel(); } catch (e) { } });
  applyStatic();
  render();
})();

</script>

<script>
(function () {
  var LPx = window.LP || { id: 'hi' };
  var sel = document.getElementById('tgt'); if (sel) { sel.value = LPx.id; sel.addEventListener('change', function () { try { localStorage.setItem('hindi.target', sel.value); } catch (e) { } location.reload(); }); }
  if (LPx.id !== 'hi') {
    var b = document.getElementById('brand'); if (b) b.textContent = LPx.brand;
    document.title = LPx.ta + ' பேசுவோம்';
    if (LPx.font) document.documentElement.style.setProperty('--f-hi', LPx.font);
  }
})();

<script>
(function () {
  var L = window.LP, U = window.LPU, box = document.getElementById('gen');
  if (!L || L.id === 'hi' || !U || !box) return;
  var KEY = 'hb.gen.' + L.id, running = false;
  function todo() { return U.units.filter(function (u) { return !U.gen[u.key]; }); }
  function paint(msg) {
    var total = U.units.length, left = todo().length, done = total - left;
    var h = '<div style="margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px">';
    h += '<div style="font-weight:600">' + L.ta + ' பாடங்கள்: ' + done + ' / ' + total + '</div>';
    if (msg) h += '<div style="color:var(--mute);margin-top:4px">' + msg + '</div>';
    if (left && !running) h += '<button type="button" id="genGo" style="margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600">✨ ' + (done ? 'மீதமுள்ளவற்றை உருவாக்கு' : 'முழு பாடத்தை உருவாக்கு (Hindi போலவே)') + '</button>';
    if (running) h += '<div style="color:var(--mute);margin-top:4px">உருவாக்குகிறது… திரையை மூடாதீர்கள்</div>';
    if (done) h += ' <button type="button" id="genPdf" style="margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--surface2)">📄 PDF</button>';
    if (done) h += ' <button type="button" id="genShow" style="margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--surface2)">இதுவரை உள்ளதைக் காட்டு</button> <button type="button" id="genReset" style="margin-top:8px;padding:8px 10px;color:var(--mute)">அழி</button>';
    h += '<div style="color:var(--mute);margin-top:6px">ஒரு பகுதியைத் தொட்டால் அது மட்டும் உருவாகும். AI உருவாக்கிய உள்ளடக்கம் — தாய்மொழி பேசுபவரிடம் சரிபார்க்கவும்.</div></div>';
    box.innerHTML = h;
    var a = document.getElementById('genGo'); if (a) a.onclick = run;
    var pf = document.getElementById('genPdf'); if (pf) pf.onclick = pdf;
    var b = document.getElementById('genShow'); if (b) b.onclick = function () { location.reload(); };
    var c = document.getElementById('genReset'); if (c) c.onclick = function () { if (confirm('உருவாக்கிய பாடங்களை அழிக்கவா?')) { try { localStorage.removeItem(KEY); } catch (e) { } location.reload(); } };
  }
  function pdf() {
    var D = window.LPDOC, E = function (x) { return String(x == null ? '' : x).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
    var dir = L.id === 'ar' ? 'rtl' : 'ltr', n = 0, toc = '', body = '';
    function row(c) { return '<tr><td class="n" dir="' + dir + '">' + E(c[0]) + '</td><td class="p">' + E(c[1]) + '<small>' + E(c[2]) + '</small></td><td>' + E(c[3]) + '</td><td>' + E(c[4]) + '</td></tr>'; }
    var head = '<tr><th>' + L.name + '</th><th>ஒலிப்பு</th><th>தமிழ்</th><th>English</th></tr>';
    D.groups.forEach(function (g) {
      D.sections.filter(function (x) { return x.grp === g.id && !x.pending && x.items; }).forEach(function (x) {
        n++; toc += '<li>' + E(x.ta) + ' · ' + E(x.en) + '</li>';
        body += '<h2>' + n + ' ' + E(x.ta) + ' · ' + E(x.en) + '</h2><table>' + head + x.items.map(function (i) { return row([i.hi, i.pr, i.ro, i.ta, i.en]); }).join('') + '</table>';
      });
    });
    D.dialogues.forEach(function (d) {
      if (!d.lines) return; n++; toc += '<li>' + E(d.ta) + ' · ' + E(d.en) + '</li>';
      body += '<h2>' + n + ' ' + E(d.ta) + ' · ' + E(d.en) + '</h2><table>' + head + d.lines.map(function (i) { return row([i.hi, i.pr, i.ro, i.ta, i.en]); }).join('') + '</table>';
    });
    var cover = '<div class="cov"><h1 dir="' + dir + '">' + E(L.brand) + '</h1><h3>Speak ' + E(L.name) + '</h3><p>' + E(L.ta) + ' பேசுவோம் · ' + E(L.name) + ' · தமிழ் எழுத்தில் உச்சரிப்பு · தமிழ் · English</p><p><b>' + n + '</b> sections</p></div><div class="pg"><h2>உள்ளடக்கம் · Contents</h2><ol>' + toc + '</ol></div>';
    var css = '<style>@page{size:A4;margin:14mm}#pd{position:fixed;inset:0;z-index:99;overflow:auto;background:#fff;color:#111;padding:16px;font:13px/1.4 system-ui,"Noto Sans Tamil","Noto Naskh Arabic","Noto Sans Kannada",sans-serif}#pd table{width:100%;border-collapse:collapse;margin:6px 0 16px}#pd th,#pd td{border:1px solid #ccd;padding:4px 6px;vertical-align:top}#pd th{background:#eef2ef}#pd td.n{font-size:17px}#pd td.p{color:#0b3d91}#pd small{display:block;color:#666}#pd .cov{text-align:center;padding:90px 0;page-break-after:always}#pd .cov h1{font-size:44px;margin:0}#pd .pg{page-break-after:always}#pd h2{font-size:16px;margin:14px 0 4px;break-after:avoid}#pd .bar{position:sticky;top:0;background:#fff;padding:6px 0}@media print{body>*:not(#pd){display:none!important}#pd{position:static;overflow:visible;padding:0}#pd .bar{display:none}}</style>';
    var el = document.getElementById('pd'); if (el) el.remove();
    el = document.createElement('div'); el.id = 'pd';
    el.innerHTML = css + '<div class="bar"><button id="pdPrint" style="padding:8px 14px;font-weight:700">🖨 PDF / Print</button> <button id="pdHtml" style="padding:8px 14px">⬇ HTML</button> <button id="pdClose" style="padding:8px 14px">✕</button></div>' + cover + body;
    document.body.appendChild(el);
    document.getElementById('pdPrint').onclick = function () { window.print(); };
    document.getElementById('pdClose').onclick = function () { el.remove(); };
    document.getElementById('pdHtml').onclick = function () {
      var h = '<!doctype html><meta charset="utf-8"><title>' + E(L.name) + '</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil&family=Noto+Naskh+Arabic&family=Noto+Sans+Kannada&display=swap">' + el.innerHTML.replace(/<div class="bar">.*?<\/div>/, '');
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([h], { type: 'text/html' })); a.download = 'Speak_' + L.name.replace(/\s+/g, '_') + '.html'; document.body.appendChild(a); a.click(); a.remove();
    };
  }
  function build(lines) {
    var st = L.id === 'ar' ? 'Egyptian Arabic (colloquial Masri, NOT Modern Standard Arabic) in Arabic script; "r" uses Egyptian-style Roman transliteration with 3 for the letter ain' : 'natural spoken Kannada (Karnataka) in Kannada script; "r" is a simple lowercase Roman transliteration';
    return 'Build a ' + L.name + ' lesson for adult Tamil-speaking learners. Input is a JSON list of meanings (Tamil "ta" and English "en"). For every item give the ' + st + '. Translate by meaning in natural spoken style, male speaker, polite "you". Keep "..." placeholders as they are. Fields: "t" = ' + L.name + ' text in native script, "p" = approximate pronunciation written in Tamil script, "r" = Roman transliteration. Return ONLY a JSON array of exactly ' + lines.length + ' objects {"t","p","r"} in the same order, no markdown.\n' + JSON.stringify(lines);
  }
  async function api(content) {
    var key = localStorage.getItem('hb.key');
    if (!key) { key = window.prompt('Anthropic API key (sk-ant-...)'); if (!key) throw new Error('nokey'); localStorage.setItem('hb.key', key.trim()); }
    for (var a = 0; a < 3; a++) {
      var r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': key.trim(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model: 'claude-haiku-5-5', max_tokens: 6000, messages: [{ role: 'user', content: content }] }) });
      if (r.status === 401 || r.status === 403) { localStorage.removeItem('hb.key'); throw new Error('badkey'); }
      if (r.status === 429 || r.status >= 500) { await new Promise(function (ok) { setTimeout(ok, 4000 * (a + 1)); }); continue; }
      var j = await r.json(); return (j.content || []).map(function (c) { return c.text || ''; }).join('');
    }
    throw new Error('api');
  }
  async function chunk(lines) {
    for (var a = 0; a < 2; a++) {
      var t = (await api(build(lines))).replace(/```json|```/g, '').trim(), i = t.indexOf('['), k = t.lastIndexOf(']');
      try { var arr = JSON.parse(t.slice(i, k + 1)); if (arr.length === lines.length) return arr.map(function (o) { return [o.t || '', o.p || '', o.r || '']; }); } catch (e) { }
    }
    throw new Error('parse');
  }
  async function doUnit(u) {
    var out = [];
    for (var i = 0; i < u.lines.length; i += 20) out = out.concat(await chunk(u.lines.slice(i, i + 20)));
    U.gen[u.key] = out; try { localStorage.setItem(KEY, JSON.stringify(U.gen)); } catch (e) { }
  }
  async function run() {
    if (running) return; running = true;
    var q = todo(), errs = 0, fatal = '';
    paint('');
    async function worker() { while (q.length && !fatal) { var u = q.shift(); try { await doUnit(u); } catch (e) { if (e.message === 'nokey' || e.message === 'badkey') fatal = e.message; else errs++; } paint(''); } }
    await Promise.all([worker(), worker(), worker()]);
    running = false;
    if (fatal) { paint(fatal === 'badkey' ? 'API key தவறு. மீண்டும் தொட்டுச் சரியான key கொடுங்கள்.' : 'API key தேவை.'); return; }
    if (!todo().length) { location.reload(); return; }
    paint('சில பகுதிகள் தோல்வி (' + errs + '). மீண்டும் தொடுங்கள்.');
  }
  document.addEventListener('click', async function (e) {
    var t = e.target.closest && e.target.closest('[data-act="open"]'); if (!t) return;
    var id = t.getAttribute('data-sec'); if (!U.pend || !U.pend[id]) return;
    e.stopPropagation(); e.preventDefault();
    if (running) return; running = true;
    var u = U.units.filter(function (x) { return x.key === 's:' + id; })[0];
    paint('இந்தப் பகுதியை உருவாக்குகிறது…');
    try { await doUnit(u); try { sessionStorage.setItem('hb.reopen', id); } catch (e2) { } location.reload(); }
    catch (er) { running = false; paint(er.message === 'nokey' ? 'API key தேவை.' : er.message === 'badkey' ? 'API key தவறு. மீண்டும் தொடுங்கள்.' : 'தோல்வி. மீண்டும் தொடுங்கள்.'); }
  }, true);
  try { var ro = sessionStorage.getItem('hb.reopen'); if (ro) { sessionStorage.removeItem('hb.reopen'); setTimeout(function () { var c = document.querySelector('[data-act="open"][data-sec="' + ro + '"]'); if (c) c.click(); }, 150); } } catch (e3) { }
  paint('');
})();
</script>
